# DevSecOps toolchain trên EKS

## Source & CI
- GitLab
  - Monorepo · MR approval
  - GitLab CI runners
- Jenkins agents
  - Namespace riêng
  - Karpenter spot nodes

## Code security
- SAST
  - Coverity
  - Semgrep rules
- SCA
  - Black Duck
  - Nexus Firewall
- IAST · Seeker

## Supply chain
- Ký image bằng Cosign
- Kyverno verify-image policy
- Trivy Operator
  - DB mirror từ ECR
  - Quét image trong cluster

## Delivery
- Argo CD (GitOps)
  - App of apps
  - Sync waves
- Terraform cho GitLab & hạ tầng
- Gateway API · agentgateway

## Runtime
- Cilium + VPC CNI chaining
- Tetragon runtime enforcement
- Bottlerocket AMI

## Observability
- Grafana LGTM
  - Loki · logs
  - Mimir · metrics
  - Tempo · traces
- Alloy collectors
